services:
  relayer:
    # Built locally from this repo for now. Once images are published to GHCR,
    # replace `build:` and this `image:` with the published one:
    #   image: ghcr.io/czahrien/relayer:latest
    build: .
    image: relayer:local
    init: true
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      MAX_ROOM_MB: ${MAX_ROOM_MB:-2048}
      ROOM_IDLE_TTL_MIN: ${ROOM_IDLE_TTL_MIN:-60}
      # Set to false when /start is behind authentication; see the README.
      CREATE_ROOM_ON_JOIN: ${CREATE_ROOM_ON_JOIN:-true}
      # The server music library: set to /music and mount your folder below.
      LIBRARY_DIR: ${LIBRARY_DIR:-}
      LIBRARY_RESCAN_MIN: ${LIBRARY_RESCAN_MIN:-360}
      # A YouTube Data API key turns on YouTube search and playlist links.
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # How people can reach you, shown on /privacy and /terms.
      OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
      # The Discord Activity: set all four, or none; see the README.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_IDS: ${DISCORD_GUILD_IDS:-}
    volumes:
      # Uploaded media for live rooms. Rooms don't survive a restart, and the
      # server clears this directory on startup.
      - media:/data
      # Your music, read-only, for the server library:
      # - /srv/music:/music:ro

volumes:
  media:
